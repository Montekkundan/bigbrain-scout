name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m bigbrain_scout plan --request examples/safe-request.json
      - run: python -m bigbrain_scout demo --output artifacts/demo
      - run: python -m bigbrain_scout verify --capsule artifacts/demo
      - run: python artifacts/demo/reproduce.py --output artifacts/reproduced-demo.raw
