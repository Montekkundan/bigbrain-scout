[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbrain-scout"
version = "0.1.0"
description = "An early prototype for explicit BigBrain ROI preflight and provenance"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Montek Kundan"}]
dependencies = []

[project.optional-dependencies]
audit = ["numpy==2.4.6", "scipy==1.17.1", "nibabel==5.4.2"]
live = ["siibra==1.0.1a22", "numpy==2.4.6", "scipy==1.17.1", "nibabel==5.4.2"]

[project.scripts]
bigbrain-scout = "bigbrain_scout.__main__:main"

[tool.setuptools.package-data]
bigbrain_scout = ["web/*.html", "web/*.css", "web/*.js", "data/*.json"]

[tool.setuptools.packages.find]
include = ["bigbrain_scout*"]
