[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbrain-scout"
version = "0.1.0"
description = "An early prototype for explicit BigBrain ROI preflight and provenance"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "Montek Kundan"}]
dependencies = []

[project.optional-dependencies]
live = ["siibra==1.0.1a22", "nibabel>=5,<6"]

[tool.setuptools.packages.find]
include = ["bigbrain_scout*"]
